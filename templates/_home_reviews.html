    <!-- Guest reviews, rendered from reviews.json by scripts/reviews.py -->
    <section class="home-reviews" data-reveal>
      <div class="container">
        <h2>{{ t.home.reviewsHeading }}</h2>
        <p class="home-reviews-score">
          <span id="home-rating">{{ reviews.rating }}</span> / 5
        </p>
        <p class="home-reviews-count" id="home-review-count">{{ reviews.countText }}</p>

        <div class="reviews-masonry" id="reviews-featured">
{{ reviews.featured }}
        </div>

        <p class="home-reviews-more">
          <a href="reviews.html" class="btn-outline">{{ t.home.readAllReviews }}</a>
        </p>
      </div>
    </section>
