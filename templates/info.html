<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
{{ head }}
</head>
<body>
{{ header }}

  <main>
    <!-- Page Intro -->
    <section class="info-intro">
      <div class="container text-center">
        <h1>{{ t.info.heading }}</h1>
        <p>{{ t.info.intro }}</p>
      </div>
    </section>

    <!-- Split Images -->
    <section class="info-split" data-reveal-group>
      <div class="info-split-card">
        <picture>
          <source type="image/avif" srcset="{{ photos.exterior | avif }}" sizes="(max-width: 768px) 100vw, 50vw">
          <source type="image/webp" srcset="{{ photos.exterior | webp }}" sizes="(max-width: 768px) 100vw, 50vw">
          <img src="{{ photos.exterior }}" alt="{{ t.photos.exterior }}" loading="lazy" decoding="async">
        </picture>
      </div>
      <div class="info-split-card">
        <picture>
          <source type="image/avif" srcset="{{ photos.view | avif }}" sizes="(max-width: 768px) 100vw, 50vw">
          <source type="image/webp" srcset="{{ photos.view | webp }}" sizes="(max-width: 768px) 100vw, 50vw">
          <img src="{{ photos.view }}" alt="{{ t.photos.view }}" loading="lazy" decoding="async">
        </picture>
      </div>
    </section>


    <!-- Interior Gallery -->
    <section class="info-gallery-section" data-reveal>
      <div class="container">
        <h2>{{ t.info.galleryHeading }}</h2>

        <div class="gallery-slideshow" id="gallery-slideshow">
          <div class="gallery-main">
            <picture>
              <source type="image/avif" srcset="{{ gallery.first.src | avif }}" sizes="(max-width: 1280px) 100vw, 1280px">
              <source type="image/webp" srcset="{{ gallery.first.src | webp }}" sizes="(max-width: 1280px) 100vw, 1280px">
              <img id="gallery-main-img" src="{{ gallery.first.src }}" alt="{{ gallery.first.alt }}" class="gallery-main-img" loading="lazy" decoding="async">
            </picture>
            <button class="gallery-nav prev" aria-label="{{ t.info.previousImage }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button class="gallery-nav next" aria-label="{{ t.info.nextImage }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>

          <div class="gallery-thumbs" id="gallery-thumbs">
{{ gallery.thumbs }}
          </div>
          <p class="visually-hidden" id="gallery-status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <!-- Amenities -->
    <section class="info-amenities">
      <div class="container">
        <h2>{{ t.info.amenitiesHeading }}</h2>

        <div class="amenities-grid" data-reveal-group>
{{ amenities }}
        </div>
      </div>
    </section>
  </main>

{{ footer }}
  <script src="{{ root }}js/gallery.js" defer></script>
</body>
</html>
