  <header class="site-header">
    <nav class="header-content">
      <a href="index.html" class="logo">
        <img src="{{ photos.logo }}" alt="{{ t.nav.logoAlt }}" width="50" height="50">
      </a>

      <ul class="nav-list">
        <li><a href="index.html">{{ t.nav.home }}</a></li>
        <li><a href="info.html">{{ t.nav.property }}</a></li>
        <li><a href="reviews.html">{{ t.nav.reviews }}</a></li>
        <li><a href="contact.html">{{ t.nav.contact }}</a></li>
      </ul>

      <div class="header-actions">
{{ social.header }}
        <button class="theme-toggle" aria-label="{{ t.nav.toggleTheme }}">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
        {{ languageSwitch }}
      </div>

      <button class="mobile-toggle" aria-label="{{ t.nav.menu }}" aria-expanded="false">
        <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        <svg class="close-icon" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </nav>

    <div class="mobile-nav">
      <div class="mobile-nav-inner">
        <ul>
          <li><a href="index.html">{{ t.nav.home }}</a></li>
          <li><a href="info.html">{{ t.nav.property }}</a></li>
          <li><a href="reviews.html">{{ t.nav.reviews }}</a></li>
          <li><a href="contact.html">{{ t.nav.contact }}</a></li>
        </ul>
        <div class="mobile-nav-actions">
          <button class="theme-toggle" aria-label="{{ t.nav.toggleTheme }}">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <div class="social-links">
{{ social.mobile }}
          </div>
          {{ languageSwitch }}
        </div>
      </div>
    </div>
    <div class="header-glow"></div>
  </header>
